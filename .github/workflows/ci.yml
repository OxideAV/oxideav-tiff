name: CI

# Thin shim around the OxideAV org-level reusable workflow. See
# https://github.com/OxideAV/.github for the actual job definitions and
# the input surface. Miri runs by default per the org-wide policy.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  # Standalone (no-`registry`) verification. Image-library consumers
  # depend on the crate with `default-features = false` to skip the
  # `oxideav-core` dep tree entirely, so the whole image-crate-contract
  # surface (`probe` / `info` / `decode*` / `encode*`, `TiffImage`,
  # the `Page` depth API) must build, pass its tests and be clippy-clean
  # without the framework. Tests that exercise the registry adapters are
  # `#![cfg(feature = "registry")]` and drop out of this run.
  ci-standalone:
    name: Build + test + clippy (no registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: standalone
      - name: cargo build --lib --no-default-features
        run: cargo build --lib --no-default-features --verbose
      - name: cargo test --no-default-features
        run: cargo test --no-default-features --verbose
      - name: cargo clippy --all-targets --no-default-features
        run: cargo clippy --all-targets --no-default-features --no-deps -- -D warnings
